# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
adventureApi = "5.1.1"
boostedYaml = "1.3.7"
caffeine = "3.2.4"
clikt = "5.1.0"
fastboard = "2.1.5"
jackson = "2.22.1"
kotlin = "2.4.10"
kotlinxDatetime = "0.8.0"
kotlinxCoroutines = "1.11.0"
nbtApi = "2.15.7"
mockbukkit = "4.114.0"
mockk = "1.14.9"
packetEvents = "2.12.2"
redisson = "4.6.1"
paperApi = "26.1.2.build.57-stable"
slf4j-api = "2.0.17"

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventureApi" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventureApi" }
boostedYaml = { module = "dev.dejvokep:boosted-yaml", version.ref = "boostedYaml" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
fastboard = { module = "fr.mrmicky:fastboard", version.ref = "fastboard" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatypeJsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-moduleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
nbtApi = { module = "de.tr7zw:item-nbt-api-plugin", version.ref = "nbtApi" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockkAgent = { module = "io.mockk:mockk-agent", version.ref = "mockk" }
packetEvents-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetEvents" }
packetEvents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetEvents" }
redisson = { module = "org.redisson:redisson", version.ref = "redisson" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxCoroutines"]
mockk = ["mockk", "mockkAgent"]

[plugins]
